version: "3.8"

services:
  # ==========================================
  # PORTAINER — Interfaz visual Docker
  # Accedé en: http://100.72.101.29:9000
  # ==========================================
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    ports:
      - "9000:9000"
    # Exponer para que el túnel lo pueda enganchar

  # ==========================================
  # CLÍNICA — Npm run dev (NO build!)
  # Volumen directo → hot reload instantáneo
  # ==========================================
  web-clinica-dev:
    image: node:20-alpine
    container_name: web-clinica-dev
    working_dir: /app
    # Montar el código directo → cada cambio en VPS = hot reload
    volumes:
      - ./web:/app
      # Ignorar node_modules y .next del host (se instalan dentro del container)
      - web_node_modules:/app/node_modules
      - web_dotnext:/app/.next
    environment:
      - NODE_ENV=development
      - HOSTNAME=0.0.0.0
      - PORT=3013
      # API_BASE_URL: como usamos network_mode:host, localhost = host
    # Host network → el container ve el puerto 3010 del host directamente
    network_mode: host
    command: >
      sh -c "
        cd /app &&
        npm install &&
        npm run dev -- --port 3013
      "
    restart: unless-stopped

  # ==========================================
  # WHATSAPP — Evolution API
  # Puerto: 8087 (8080 ocupado por Nginx)
  # Accedé en: http://100.72.101.29:8087
  # ==========================================
  evolution-api:
    image: atendai/evolution-api:v2.2.3
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "8087:8080"
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=http://100.72.101.29:8087
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution2024@evolution-db:5432/evolution?schema=public
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis-whatsapp:6379/0
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=true
      - AUTHENTICATION_API_KEY=SetubalAI2024!
      - CONFIG_SESSION_PHONE_CLIENT=SetubalAI
      - CONFIG_SESSION_PHONE_NAME=SetubalAI
    volumes:
      - evolution-instances:/evolution/instances
    depends_on:
      - evolution-db
      - redis-whatsapp
    networks:
      - evolution-net

  # ==========================================
  # WHATSAPP — PostgreSQL para Evolution API
  # ==========================================
  evolution-db:
    image: postgres:16-alpine
    container_name: evolution-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution2024
      - POSTGRES_DB=evolution
    volumes:
      - evolution-db-data:/var/lib/postgresql/data
    networks:
      - evolution-net

  # ==========================================
  # WHATSAPP — Redis (cache para Evolution API)
  # ==========================================
  redis-whatsapp:
    image: redis:7-alpine
    container_name: redis-whatsapp
    restart: unless-stopped
    networks:
      - evolution-net

volumes:
  portainer_data:
  web_node_modules:
  web_dotnext:
  evolution-instances:
  evolution-db-data:

networks:
  evolution-net:
    driver: bridge
